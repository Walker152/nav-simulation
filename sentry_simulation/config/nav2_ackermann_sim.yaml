# Explicit Ack online simulation profile. The default remains nav2_sim.yaml (Omni).
# Vehicle/controller/cold/seed values retain navi2 ackermann_prototype.yaml.
# Frames and the online ROG block retain nav2_sim.yaml's actual Point-LIO chain.
# Original measured body odometry is converted by the shared sensor offset;
# do not replace it with ground truth, zero twist or a newly stamped reference.
# GT is an independent oracle. No runtime/physical success is implied by this file.
# Nav2 host owns footprint padding, applied once. This rear-axle rectangle is raw.
# MapServer selects the world map; ROG prior is disabled to avoid a different arena.
# Stationary, feedback and tracking-rate ownership stays controller -> assembler.
frames:
  map: map
  odom: camera_init
  base: base_link
odometry:
  topic: /aft_mapped_to_init
  child_frame: body
  timeout: 0.5
  sensor_in_base:
    xyz:
    - 0.0
    - -0.2
    - 0.0
    rpy:
    - 0.0
    - 0.0
    - 0.0
vehicle:
  model: ackermann
  max_velocity: 1.0
  max_acceleration: 1.0
  max_yaw_rate: 1.0
  max_yaw_acceleration: 2.0
  ackermann:
    wheel_base: 0.44
    front_track: 0.44
    max_steering_angle: 0.4
    max_steering_rate: 0.3
  footprint:
  - - -0.083
    - -0.276
  - - 0.519
    - -0.276
  - - 0.519
    - 0.276
  - - -0.083
    - 0.276
planner:
  expected_frequency: 20.0
  mode: PRIORMAP
  tolerance: 0.0
  use_smac: true
  allow_unknown: false
  priormap:
    clip_seed_by_rog_boundary: true
    rog_boundary_margin: 0.2
    rog_boundary_sample_step: 0.1
  exploration:
    boundary_margin: 0.2
    boundary_sample_step: 0.1
    unknown_as_occupied: true
    prefer_goal_direction: true
  performance:
    enable: false
    print_enable: false
    detailed_csv_enable: false
    odom_sub_debug_enable: false
    minco_csv_path: /tmp/ack_owner_planner.csv
    print_period_sec: 1.0
    csv_flush_every_n: 30
    run_id: ''
    scenario: ack_online_sim
    variant: ''
  rog_map:
    resolution: 0.05
    inflation_resolution: 0.05
    map_size:
    - 10.0
    - 10.0
    - 3.0
    fix_map_origin:
    - 0.0
    - 0.0
    - 0.0
    map_sliding:
      enable: true
      threshold: 0.2
      center_offset_enable: true
      center_offset:
      - 0.0
      - 0.2
      - 0.0
    ros_callback:
      enable: true
      cloud_topic: /cloud_registered_full
      update_period_ms: 100
    cloud_filter:
      enable: false
    raycasting:
      enable: true
      batch_update_size: 1
      ray_range:
      - 0.03
      - 10.0
      local_update_box:
      - 10.0
      - 10.0
      - 3.0
      unk_thresh: 0.7
      p_hit: 0.9
      p_miss: 0.45
      p_min: 0.12
      p_max: 0.97
      p_occ: 0.85
      p_free: 0.499
      parallel_enable: false
      num_threads: 4
    decay:
      enable: true
      keep_time: 0.5
      clear_time: 1.2
      active_list_enable: false
    projection:
      enable: true
      prior_map:
        enable: false
        yaml_path: ''
        pgm_path: ''
      scan_z_min_abs: -0.8
      scan_z_max_abs: 1.5
      unknown_as_occupied: false
      min_observed_voxels: 2
      surface_height_delta_max: 0.1
      wall_height_delta_min: 0.3
      wall_occupancy_ratio_min: 0.7
      tunnel_height_delta_min: 0.25
      tunnel_height_delta_max: 0.4
      tunnel_occupancy_ratio_max: 0.6
      passable_cost: 50
      passable_as_free: true
      hysteresis_enable: false
      obstacle_hold_time: 0.0
      mask_filter_en: true
      fill_occ_min: 8
      denoise_occ_max: 0
    field:
      enable: true
      inflation_radius: 0.0
      max_distance: 6.0
      min_distance: -3.0
      clamp_distance: true
      interpolation: quadratic
      update_rate: 20.0
    performance:
      enable: false
      detailed_csv_enable: false
      summary_csv_enable: false
      detailed_csv_path: /tmp/rog_map_perf_detailed.csv
      summary_csv_path: /tmp/rog_map_perf_summary.csv
      run_id: ''
      scenario: ''
      variant: ''
      csv_flush_every_n: 30
      print_enable: true
      summary_rate: 1.0
      dirty_column_enable: true
      dirty_full_ratio: 0.3
      parallel_raycast_enable: false
      raycast_num_threads: 4
    visualization:
      enable: true
      rate: 10.0
      range:
      - 10.0
      - 10.0
      - 1.5
  smac_2d:
    use_esdf_cost: true
    esdf_weight: 1.0
    esdf_decay: 0.8
    esdf_max_cost: 0.5
  minco_optimizer:
    traj_goal_tolerance: 0.025
    enable_yaw_opt: false
    safe_dist: 0.3
    collision_dist: 0.1
    lookahead_dist: 6.0
    smooth_eps: 0.01
    integral_res: 64
    opt_accuracy: 0.0001
    print_optimizer_log: false
    penalty_weight_time: 0.01
    penalty_weight_pos: 0.0
    penalty_weight_vel: 1000.0
    penalty_weight_acc: 1000.0
    penalty_weight_att: 1000.0
    ackermann:
      min_speed: 0.05
      weights:
      - 1000.0
      - 1000.0
      - 1000.0
  recovery_server:
    fail_threshold: 5
    cooldown_sec: 1.0
    recovery_window_sec: 3.0
    escape_speed: 0.5
  ackermann:
    goal_yaw_tolerance: 0.04
    cold:
      center_tolerance: 0.001
    seed:
      transition_speed: 0.2
      transition_distance: 0.1
      segment_length: 3.0
      max_full_route_length: 10.0
controller:
  frequency: 20.0
  goal_tolerance:
    xy: 0.025
    yaw: 0.04
  q_along: 3.0
  q_cross: 12.0
  q_yaw: 2.0
  R:
  - 1.5
  - 1.5
  - 1.0
  dt: 0.05
  lookahead_time: 1.5
  control_delay_compensation: 0.0
  output_phase_delay: 0.0
  deadzone_speed_threshold: 0.0
  use_small_gyro_mode: false
  fixed_wz: 0.0
  performance:
    enable: false
    print_enable: false
    detailed_csv_enable: false
    odom_sub_debug_enable: false
    mpc_csv_path: /tmp/ack_owner_controller.csv
    print_period_sec: 1.0
    csv_flush_every_n: 30
    run_id: ''
    scenario: ack_online_sim
    variant: ''
  ackermann_control_wait_timeout: 0.15
  ackermann:
    state_weights:
    - 10.0
    - 30.0
    - 10.0
    - 3.0
    - 1.0
    control_weights:
    - 0.2
    - 1.0
    steering_time_constant: 1.0
    tracking_steering_rate: 0.13
    yaw_command_deadband: 0.001
    control_timing_tolerance: 0.005
    stationary:
      longitudinal: 0.005
      lateral: 0.005
      yaw_rate: 0.005
      duration: 0.5
    feedback:
      topic: /sim/steering_joint_states
      left_joint: front_left_steering_joint
      right_joint: front_right_steering_joint
      timeout: 0.05
      max_skew: 0.02
      max_center_disagreement: 0.02
      max_future_ahead: 0.005
      pending_wall_timeout: 0.05
