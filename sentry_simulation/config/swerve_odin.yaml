# Chassis/Odin housing geometry and chassis motion limits match navigation_odin_hardware.yaml.
# Wheel modules, mass, contact and actuator dynamics remain simulation assumptions.
geometry:
  length: 0.730
  width: 0.530
  body_height: 0.300         # Measured housing ground span [0.200, 0.500] m.
  body_center_z: -0.180      # base_link is on the Odin centre plane at 0.530 m.
  wheelbase: 0.680
  track: 0.480
  wheel_center_z: -0.465     # 0.065 m wheel radius - 0.530 m base ground clearance.
  wheel_radius: 0.065
  wheel_contact_width: 0.024 # Vendor total wheel width is 0.030 m.
  steering_limit: 2.7052603406       # Normal targets: +/-155 degrees.
  steering_hard_limit: 2.9321531434  # Assumed physical endpoints: +/-168 degrees.
  spindle_length: 0.055      # Unmeasured steering carrier box.
  spindle_width: 0.055
  spindle_height: 0.070
  spindle_center_z: 0.055    # COM/collision center above wheel/steering origin.
  sensor_height: 0.0         # Odin housing centres share the base_link plane.
dynamics:
  total_mass: 100.0          # Includes four 0.274 kg canonical O1LITE models.
  steer_mass: 3.2            # Each 4.7 kg module split into 3.2 + 1.5 kg.
  wheel_mass: 1.5
  friction: 1.0             # Uncalibrated polyurethane/ground assumption.
  contact_stiffness: 1000000.0
  contact_damping: 100.0
  steering_damping: 0.05
  wheel_damping: 0.01
control:
  max_linear_speed: 0.5
  max_yaw_speed: 1.6
  max_wheel_speed: 3.0
  linear_acceleration: 0.8
  yaw_acceleration: 1.6
  max_steering_velocity: 6.28318530718
  max_steering_acceleration: 50.2654824576 # Steering reference [rad/s^2]; flat-ground sim tuned.
  command_timeout: 0.25
  publish_rate: 100.0
  steering_kp: 80.0
  steering_kd: 4.0
  steering_torque: 13.5
  wheel_kp: 4.0              # Wheel speed servo [N m / (rad/s)]; flat-ground sim tuned.
  wheel_torque: 22.0
physics:
  step: 0.002                # 500 Hz controller runs once per physics step.
  real_time_factor: 1.0
